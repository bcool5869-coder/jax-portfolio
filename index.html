<style>
:root{
  --ink:#3b2a1a;
  --muted:#8a735c;
  --acc:#ff8a1f;
  --soft:#fff3df;
  --edge:rgba(120,70,0,.14);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'M PLUS Rounded 1c',system-ui,sans-serif;font-weight:500;
  color:var(--ink);overflow:hidden;
  background:radial-gradient(120% 90% at 58% 42%,#ffeab0 0%,#f8c858 55%,#efa73a 100%);
}
.static body{overflow:auto}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

#sky{
  position:fixed;inset:0;opacity:0;transition:opacity 1.2s ease;pointer-events:none;
  background:radial-gradient(120% 90% at 58% 42%,#33437a 0%,#1a2350 55%,#0c1130 100%);
}
.night #sky{opacity:1}
.night .hint{color:rgba(255,255,255,.6)}
#mode{font-size:15px;line-height:1;padding:8px 12px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.static #gl{display:none}

/* ─── chrome ──────────────────────────────────── */
.logo{
  position:fixed;top:20px;left:24px;z-index:10;
  display:flex;align-items:center;gap:10px;
  background:#fff;border-radius:16px;padding:7px 16px 7px 7px;
  box-shadow:0 5px 0 var(--edge);
}
.logo i{
  width:34px;height:34px;border-radius:11px;background:var(--acc);color:#fff;
  display:grid;place-items:center;font-style:normal;font-weight:800;font-size:18px;
}
.logo b{display:block;font-size:16px;font-weight:800;line-height:1}
.logo small{display:block;font-size:10px;color:var(--muted);font-weight:700;margin-top:3px}

nav.pill{
  position:fixed;top:20px;right:24px;z-index:10;
  display:flex;gap:2px;background:#fff;border-radius:99px;padding:6px;
  box-shadow:0 5px 0 var(--edge);
}
nav.pill button,nav.pill a{font-size:13px;font-weight:800;padding:8px 16px;border-radius:99px;transition:background .2s}
nav.pill .on,nav.pill button:hover,nav.pill a:hover{background:var(--soft)}

/* ─── card ────────────────────────────────────── */
.card{
  position:fixed;left:24px;top:50%;transform:translateY(-50%);z-index:10;
  width:min(380px,calc(100vw - 48px));max-height:calc(100vh - 150px);overflow:auto;
  background:#fff;border-radius:26px;padding:28px 26px 24px;
  box-shadow:0 8px 0 var(--edge),0 24px 50px rgba(120,70,0,.14);
}
.card.swap #cardBody{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--acc);margin-bottom:6px}
.card h2{font-size:28px;font-weight:800;line-height:1.2;margin-bottom:12px}
.card p{font-size:14px;line-height:1.8;color:var(--muted);margin-bottom:18px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{
  display:flex;align-items:center;gap:8px;
  background:#fffaf2;border:2px solid #ffe6c2;border-radius:13px;
  padding:8px 10px;font-size:12.5px;font-weight:800;
  transition:transform .2s,border-color .2s;
}
.chip:hover{transform:translateY(-2px);border-color:var(--acc)}
.chip i{width:10px;height:10px;border-radius:4px;flex:none}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 20px}
.tags span{font-size:11px;font-weight:800;background:var(--soft);color:#b5651d;border-radius:99px;padding:4px 10px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--acc);color:#fff;font-size:14px;font-weight:800;
  border-radius:99px;padding:11px 22px;box-shadow:0 4px 0 #d96f0a;
  transition:transform .15s,box-shadow .15s;
}
.btn:hover{transform:translateY(2px);box-shadow:0 2px 0 #d96f0a}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:0 4px 0 #f1d9b4}
.btn.ghost:hover{box-shadow:0 2px 0 #f1d9b4}
.badge{font-size:12px;font-weight:800;color:var(--muted);background:#f4efe8;border-radius:99px;padding:9px 16px}
.steps{display:flex;justify-content:space-between;margin-top:20px;padding-top:16px;border-top:2px dashed #f3e4cd}
.steps button{font-size:12px;font-weight:800;color:var(--muted);padding:4px 2px}
.steps button:hover{color:var(--acc)}

/* ─── hover tip + hint ────────────────────────── */
#tip{
  position:fixed;z-index:20;pointer-events:none;
  background:#fff;border-radius:12px;padding:6px 12px;font-size:13px;font-weight:800;
  box-shadow:0 4px 0 var(--edge);transform:translate(14px,14px);
  opacity:0;transition:opacity .15s;white-space:nowrap;
}
#tip.show{opacity:1}
.hint{position:fixed;right:24px;bottom:20px;z-index:10;font-size:12px;font-weight:800;color:rgba(59,42,26,.55)}
.static .hint{display:none}

:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

@media (max-width:820px){
  .logo{top:12px;left:12px;padding:5px 12px 5px 5px}
  .logo i{width:30px;height:30px;font-size:16px}
  .logo small{display:none}
  nav.pill{top:12px;right:12px;padding:4px}
  nav.pill button,nav.pill a{padding:7px 11px;font-size:12px}
  nav.pill .gh{display:none}
  .card{
    left:12px;right:12px;bottom:12px;top:auto;transform:none;width:auto;
    max-height:44vh;padding:20px 18px 16px;border-radius:22px;
  }
  .card h2{font-size:22px;margin-bottom:8px}
  .card p{font-size:13px;line-height:1.7;margin-bottom:14px}
  .hint{display:none}
  .static .card{position:relative;margin:76px 12px 12px;max-height:none;left:auto;right:auto;bottom:auto}
}
@media (prefers-reduced-motion:reduce){.card.swap #cardBody{animation:none}}
</style>

<script>
/* project data + card UI (works without WebGL too) */
var PROJECTS = [
  {id:'solar-system', b:'observatory', color:'#ff6b6b', kind:'LIVE · WEBGL',
   desc:'Sun, 8 planets, moons and rings animated in one self-contained HTML file.',
   tags:['three.js','single file'], url:'https://bcool5869-coder.github.io/solar-system/'},
  {id:'vedic-astro-clock', b:'clocktower', color:'#e8835a', kind:'LIVE · ASTRONOMY',
   desc:'A live observatory clock of the Vedic sky — planets, signs and time, ticking in real time.',
   tags:['astronomy','canvas'], url:'https://bcool5869-coder.github.io/vedic-astro-clock/'},
  {id:'data-craft', b:'datatower', color:'#38d9a9', kind:'LIVE · COURSE',
   desc:'Hands-on data science & AI course: real Python in your browser and a private AI tutor.',
   tags:['pyodide','wllama','python'], url:'https://bcool5869-coder.github.io/data-craft/'},
  {id:'3d-anywhere', b:'cinema', color:'#f03e3e', kind:'LIVE · VIDEO',
   desc:'Watch any video in 3D on any device — phone, laptop, tablet, VR. No server, no GPU, no upload.',
   tags:['webgl','depth','vr'], url:'https://bcool5869-coder.github.io/3d-anywhere/'},
  {id:'story-craft', b:'library', color:'#9775fa', kind:'LIVE · COURSE',
   desc:'Storytelling course with a small AI writing partner running right in your browser.',
   tags:['on-device AI','writing'], url:'https://bcool5869-coder.github.io/story-craft/'},
  {id:'promptdeck', b:'cardshop', color:'#f78fb3', kind:'LIVE · TOOL',
   desc:'A library of battle-tested image & video prompts — browse, build and rewrite.',
   tags:['astro','prompts'], url:'https://promptdeck1.promptdeck.workers.dev/'},
  {id:'kalos', b:'scanlab', color:'#12b886', kind:'PRIVATE BUILD · AI',
   desc:'AI face analysis with live 3D scanning — a MediaPipe face mesh plus Gemini insight.',
   tags:['mediapipe','gemini','webgl']},
  {id:'video-studio', b:'filmstudio', color:'#ffa94d', kind:'PRIVATE BUILD · AI VIDEO',
   desc:'Prompt-to-video, fully local: LTX diffusion running on my own GPU. No cloud, no queue.',
   tags:['diffusion','comfyui','python']},
  {id:'screenmirror', b:'broadcast', color:'#4dabf7', kind:'OPEN SOURCE',
   desc:'Show a Windows PC’s screen on an iPhone or iPad over USB cable or Wi-Fi.',
   tags:['windows','ios','streaming'], url:'https://github.com/bcool5869-coder/ScreenMirror', src:true},
  {id:'nebula', b:'balloon', color:'#748ffc', kind:'CONCEPT',
   desc:'A generative identity that never renders the same form twice — brand as a living thing.',
   tags:['generative','shaders']}
];

(function(){
  function webglOK(){
    try{ var c=document.createElement('canvas'); return !!(c.getContext('webgl2')||c.getContext('webgl')); }
    catch(e){ return false; }
  }
  if (location.search.indexOf('static=1') !== -1 || !webglOK()) document.documentElement.classList.add('static');
  setTimeout(function(){ if (!window.__GL_RUNNING) document.documentElement.classList.add('static'); }, 6000);

  var card = document.getElementById('card'), body = document.getElementById('cardBody');
  var byId = {}; PROJECTS.forEach(function(p, i){ p.i = i; byId[p.id] = p; });

  function chips(){
    return '<div class="chips">' + PROJECTS.map(function(p){
      return '<a class="chip" data-pid="' + p.id + '" href="' + (p.url || '#' + p.id) + '"' +
        (p.url ? ' target="_blank" rel="noopener"' : '') + '><i style="background:' + p.color + '"></i>' + p.id + '</a>';
    }).join('') + '</div>';
  }
  var VIEWS = {
    intro: function(){
      return '<div class="eyebrow">CREATIVE DEVELOPER</div><h2>Hi, I’m Jax.</h2>' +
        '<p>I build tools, sites and visuals where design, code and AI collide. Every building on this island is a project — click one to step inside.</p>' + chips();
    },
    about: function(){
      return '<div class="eyebrow">ABOUT</div><h2>Code, AI &amp; tiny worlds.</h2>' +
        '<p>I make browser toys, AI tools and 3D sites. Most of what lives on this island runs fully in your browser or on my own GPU — no cloud required.</p>' +
        '<div class="tags"><span>three.js</span><span>WebGL</span><span>Python</span><span>diffusion</span><span>LLMs</span><span>UI design</span></div>' +
        '<div class="row"><a class="btn" href="mailto:bcool5869@gmail.com">Say hi</a><a class="btn ghost" href="https://github.com/bcool5869-coder" target="_blank" rel="noopener">GitHub ↗</a></div>';
    }
  };
  function project(p){
    var n = PROJECTS.length, prev = PROJECTS[(p.i + n - 1) % n], next = PROJECTS[(p.i + 1) % n];
    var act = p.url
      ? '<a class="btn" href="' + p.url + '" target="_blank" rel="noopener">' + (p.src ? 'View source' : 'Open project') + ' ↗</a>'
      : '<span class="badge">' + (p.kind.indexOf('CONCEPT') === 0 ? 'Concept piece' : 'Private build') + '</span>';
    return '<div class="eyebrow">' + p.kind + '</div><h2>' + p.id + '</h2><p>' + p.desc + '</p>' +
      '<div class="tags">' + p.tags.map(function(t){ return '<span>' + t + '</span>'; }).join('') + '</div>' +
      '<div class="row">' + act + '<button class="btn ghost" data-go="intro">← Island</button></div>' +
      '<div class="steps"><button data-pid="' + prev.id + '">‹ ' + prev.id + '</button><button data-pid="' + next.id + '">' + next.id + ' ›</button></div>';
  }

  function show(v){
    body.innerHTML = byId[v] ? project(byId[v]) : VIEWS[v]();
    card.classList.remove('swap'); void card.offsetWidth; card.classList.add('swap');
    document.querySelectorAll('nav.pill [data-go]').forEach(function(b){ b.classList.toggle('on', b.dataset.go === v); });
    window.__view = v;
    window.dispatchEvent(new CustomEvent('fly', { detail: v }));
  }
  window.UI = { show: show };

  /* day / night: remembered choice, else the visitor's local clock */
  var root = document.documentElement, modeBtn = document.getElementById('mode'), saved = null;
  try { saved = localStorage.getItem('jax-mode'); } catch(e){}
  var h = new Date().getHours();
  function setMode(n){
    root.classList.toggle('night', n);
    modeBtn.textContent = n ? '☀' : '☾';
    modeBtn.setAttribute('aria-label', n ? 'Switch to day' : 'Switch to night');
  }
  setMode(saved ? saved === 'night' : (h >= 19 || h < 6));
  modeBtn.addEventListener('click', function(){
    var n = !root.classList.contains('night');
    setMode(n);
    try { localStorage.setItem('jax-mode', n ? 'night' : 'day'); } catch(e){}
  });

  document.addEventListener('click', function(e){
    var go = e.target.closest('[data-go]');
    if (go){ e.preventDefault(); show(go.dataset.go); return; }
    var pc = e.target.closest('[data-pid]');
    if (pc && window.__GL_RUNNING){ e.preventDefault(); show(pc.dataset.pid); }
  });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') show('intro'); });
  show('intro');
})();
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

if (!document.documentElement.classList.contains('static')) {
  try { init(); } catch (e) {
    console.error('3D init failed, falling back to static:', e);
    document.documentElement.classList.add('static');
  }
}

function init(){
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const mobile = innerWidth <= 820;

  /* ── renderer / scene / camera ───────────────── */
  const canvas = document.getElementById('gl');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 200);
  camera.position.set(20, 17, 20);

  const hemi = new THREE.HemisphereLight(0xfff4dc, 0x9a7650, 1.5);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffffff, 2.6);
  sun.position.set(10, 18, 7);
  sun.castShadow = true;
  sun.shadow.mapSize.set(mobile ? 1024 : 2048, mobile ? 1024 : 2048);
  Object.assign(sun.shadow.camera, { left: -13, right: 13, top: 13, bottom: -13, near: 1, far: 50 });
  sun.shadow.bias = -0.0004;
  sun.shadow.normalBias = 0.02;
  scene.add(sun);

  /* ── tiny modelling kit ──────────────────────── */
  const C = {
    grass: 0x8fd16a, dirt: 0xd39a64, rock: 0xb07848, path: 0xfbe9c2, pad: 0xf6dfb0,
    white: 0xfffaf0, cream: 0xfff1d6, red: 0xff6b6b, orange: 0xffa94d, yellow: 0xffd43b,
    gold: 0xf2b33d, blue: 0x4dabf7, navy: 0x3b4a7a, purple: 0x9775fa, pink: 0xf78fb3,
    teal: 0x38d9a9, green: 0x69db7c, wood: 0xa0703f, gray: 0xb8bfc6, dark: 0x495057,
    water: 0x5ec8e8, leaf1: 0x69c35a, leaf2: 0x4fae4a,
  };
  const mats = {};
  const mat = (c, o) => {
    const k = c + (o ? JSON.stringify(o) : '');
    return mats[k] || (mats[k] = new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: .8 }, o)));
  };
  const glow = (c, i = .7) => ({ emissive: c, emissiveIntensity: i });
  const rb = (w, h, d, r = .08) => new RoundedBoxGeometry(w, h, d, 3, Math.min(r, Math.min(w, h, d) / 2 - 1e-3));
  const cyl = (rt, rb_, h, s = 24) => new THREE.CylinderGeometry(rt, rb_, h, s);
  const sph = (r) => new THREE.SphereGeometry(r, 20, 14);
  function add(parent, geo, color, x = 0, y = 0, z = 0, o){
    const m = new THREE.Mesh(geo, color instanceof THREE.Material ? color : mat(color, o));
    m.position.set(x, y, z);
    m.castShadow = m.receiveShadow = true;
    parent.add(m);
    return m;
  }

  const updates = [];

  /* ── the island ──────────────────────────────── */
  const island = new THREE.Group();
  scene.add(island);
  add(island, rb(14, .5, 11, .22), C.grass, 0, -.25, 0);
  add(island, rb(13.7, 1.1, 10.7, .15), C.dirt, 0, -1.0, 0);
  const rock = add(island, new THREE.ConeGeometry(7.1, 5, 7), C.rock, 0, -4.05, 0, { flatShading: true });
  rock.rotation.x = Math.PI; rock.scale.z = .78;

  const flat = m => { m.castShadow = false; return m; };
  flat(add(island, rb(13.4, .06, .62, .03), C.path, 0, .03, 1.8));
  flat(add(island, rb(13.4, .06, .62, .03), C.path, 0, .03, -1.8));
  flat(add(island, rb(.8, .06, 10.4, .03), C.path, 0, .035, 0));
  flat(add(island, rb(.5, .06, 3.6, .03), C.path, 6.55, .035, 0));
  flat(add(island, rb(.5, .06, 3.6, .03), C.path, -6.55, .035, 0));

  /* ── buildings (local coords, ~2.4 footprint) ── */
  const B = {
    observatory(g){
      add(g, cyl(1, 1.05, 1.4), C.white, 0, .7, 0);
      add(g, cyl(1.07, 1.07, .14), C.blue, 0, 1.25, 0);
      add(g, rb(.42, .62, .1), C.wood, 0, .31, 1.0);
      const dome = new THREE.Group(); dome.position.y = 1.4; g.add(dome);
      add(dome, new THREE.SphereGeometry(1, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), C.cream);
      add(dome, rb(.36, .95, .14, .05), C.navy, 0, .62, .64).rotation.x = -.85;
      add(dome, cyl(.11, .16, 1.2), C.dark, 0, .95, .6).rotation.x = .75;
      const orbit = new THREE.Group(); orbit.position.y = 3.2; g.add(orbit);
      add(orbit, sph(.22), C.yellow, 0, 0, 0, glow(C.yellow, .9));
      const pl = add(orbit, sph(.17), C.red, 1.05, 0, 0);
      add(orbit, new THREE.TorusGeometry(.28, .025, 8, 40), C.orange, 1.05, 0, 0).rotation.x = 1.2;
      add(orbit, sph(.1), C.blue, -.62, 0, 0);
      return t => { dome.rotation.y = Math.sin(t * .35) * 1.1; orbit.rotation.y = t * .7; pl.rotation.y = t; };
    },

    clocktower(g){
      add(g, rb(1.2, 3, 1.2, .1), 0xe8835a, 0, 1.5, 0);
      add(g, rb(1.36, .2, 1.36, .06), C.cream, 0, 3.0, 0);
      add(g, rb(1.36, .2, 1.36, .06), C.cream, 0, .1, 0);
      add(g, new THREE.ConeGeometry(.98, 1.1, 4), C.navy, 0, 3.65, 0, { flatShading: true }).rotation.y = Math.PI / 4;
      add(g, sph(.1), C.gold, 0, 4.27, 0, { metalness: .6, roughness: .3 });
      add(g, rb(.42, .62, .06), C.wood, 0, .5, .61);
      const hands = [];
      for (const [x, z, ry] of [[0, .61, 0], [.61, 0, Math.PI / 2]]){
        const f = new THREE.Group(); f.position.set(x, 2.3, z); f.rotation.y = ry; g.add(f);
        add(f, cyl(.44, .44, .06, 32), C.cream).rotation.x = Math.PI / 2;
        add(f, new THREE.TorusGeometry(.45, .05, 10, 40), C.gold, 0, 0, 0, { metalness: .5, roughness: .35 });
        for (let i = 0; i < 12; i++){
          const a = i / 12 * Math.PI * 2;
          add(f, sph(i % 3 ? .025 : .045), i % 3 ? C.purple : C.gold, Math.cos(a) * .35, Math.sin(a) * .35, .04);
        }
        const hp = new THREE.Group(), mp = new THREE.Group(); hp.position.z = mp.position.z = .06;
        f.add(hp, mp);

  /* decor: ferris wheel + pond */

  const dropN = 120, dropPos = new Float32Array(dropN * 3), dropSeed = Array.from({ length: dropN }, () => Math.random());
  const drops = new THREE.Points(new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(dropPos, 3)),
    new THREE.PointsMaterial({ color: 0xe7f8ff, size: 3, sizeAttenuation: false, transparent: true, opacity: .9, depthWrite: false }));
  island.add(drops);
  updates.push(t => {
    fallTex.offset.y = t * 1.2;
    for (let i = 0; i < dropN; i++){
      const s = dropSeed[i], k = (s * 7.3 + t * .7) % 1;
      dropPos[i * 3] = -5.28 + s * .56;
      dropPos[i * 3 + 1] = -k * 6.5;
      dropPos[i * 3 + 2] = 5.62 + k * k * .6 * s;
    }
    drops.geometry.attributes.position.needsUpdate = true;
  });

  /* birds circling the island */
  const wingGeo = [rb(.34, .03, .12, .01).translate(.17, 0, 0), rb(.34, .03, .12, .01).translate(-.17, 0, 0)];
  const birds = [0, 1, 2, 3, 4].map(i => {
    const b = new THREE.Group(); b.scale.setScalar(.8 + (i % 2) * .25); scene.add(b);
    const wr = new THREE.Mesh(wingGeo[0], mat(C.white)), wl = new THREE.Mesh(wingGeo[1], mat(C.white));
    const body = new THREE.Mesh(sph(.07), mat(C.white)); body.scale.z = 1.8;
    b.add(wr, wl, body);
    return { b, wr, wl, i };
  });
  updates.push(t => birds.forEach(({ b, wr, wl, i }) => {
    const a = t * .22 + i * .32, R = 9.5 + (i % 3) * .5;
    b.position.set(Math.cos(a) * R, 5 + Math.sin(t * .8 + i) * .4 + (i % 2) * .5, Math.sin(a) * R);
    b.rotation.y = -a;
    const f = Math.sin(t * 9 + i * 1.7) * .55;
    wr.rotation.z = f; wl.rotation.z = -f;
  }));

  /* night: street lamps, stars, brighter windows */
  const bulbMat = new THREE.MeshStandardMaterial({ color: 0xfff3bf, emissive: 0xffc56b, emissiveIntensity: .2 });
  const lamps = [[-3.6, -1.38], [3.6, -1.38], [-3.6, 1.38], [3.6, 1.38]].map(([x, z]) => {
    const l = new THREE.Group(); l.position.set(x, 0, z); island.add(l);
    add(l, cyl(.035, .05, 1.1, 8), C.dark, 0, .55, 0);
    add(l, rb(.18, .05, .18, .02), C.dark, 0, 1.12, 0);
    add(l, sph(.1), bulbMat, 0, 1.02, 0).castShadow = false;
    const pl = new THREE.PointLight(0xffc56b, 0, 4.5, 1.4); pl.position.y = 1; l.add(pl);
    return pl;
  });
  const starPos = new Float32Array(500 * 3);
  for (let i = 0; i < 500; i++){
    const v = new THREE.Vector3(rnd() - .5, rnd() * .9 - .2, rnd() - .5).normalize().multiplyScalar(45 + rnd() * 20);
    v.toArray(starPos, i * 3);
  }
  const stars = new THREE.Points(new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(starPos, 3)),
    new THREE.PointsMaterial({ color: 0xfff8e1, size: 2, sizeAttenuation: false, transparent: true, opacity: 0, depthWrite: false }));
  scene.add(stars);
  const glowMats = Object.values(mats).filter(m => m.emissive.getHex() && m.emissiveIntensity > 0);
  glowMats.forEach(m => { m.userData.base = m.emissiveIntensity; });
  const DAY = { hemi: new THREE.Color(0xfff4dc), sun: new THREE.Color(0xffffff) };
  const NIGHT = { hemi: new THREE.Color(0x7d8fd6), sun: new THREE.Color(0x9fb4ff) };
  let night = document.documentElement.classList.contains('night') ? 1 : 0;
  function applyNight(dt){
    const goal = document.documentElement.classList.contains('night') ? 1 : 0;
    night += (goal - night) * Math.min(1, dt * 2.5);
    hemi.intensity = 1.5 - .85 * night; hemi.color.lerpColors(DAY.hemi, NIGHT.hemi, night);
    sun.intensity = 2.6 - 1.8 * night; sun.color.lerpColors(DAY.sun, NIGHT.sun, night);
    glowMats.forEach(m => { m.emissiveIntensity = m.userData.base * (1 + 3 * night); });
    bulbMat.emissiveIntensity = .2 + 2.6 * night;
    lamps.forEach(l => { l.intensity = 9 * night; });
    stars.material.opacity = night;
  }

  /* ── camera rig ──────────────────────────────── */
  const controls = new OrbitControls(camera, canvas);
  controls.target.set(0, .3, 0);
  controls.enableDamping = true;
  controls.enablePan = false;
  controls.minZoom = .4; controls.maxZoom = 3.5;
  controls.minPolarAngle = .35; controls.maxPolarAngle = 1.25;
  controls.autoRotateSpeed = .5;
  controls.autoRotate = !reduced;

  let fly = null, focused = null;
  const off = { x: 0, y: 0, gx: 0, gy: 0 };

  function frustum(){
    const W = innerWidth, H = innerHeight, a = W / H, h = Math.max(16.5, 21 / a);
    Object.assign(camera, { left: -h * a / 2, right: h * a / 2, top: h / 2, bottom: -h / 2 });
    renderer.setSize(W, H);
    camera.setViewOffset(W, H, -off.x, off.y, W, H);
  }
  /* keep the focus point in the free area beside/above the card */
  function cardShift(){
    const c = document.getElementById('card').getBoundingClientRect();
    return innerWidth > 820 ? { x: c.right / 2, y: 0 } : { x: 0, y: (innerHeight - c.top + 60) / 2 };
  }
  function flyTo(v){
    const b = buildings[v];
    focused = b ? v : null;
    if (b && !reduced) b.hop = 1e-6;
    const s = cardShift();
    off.gx = s.x; off.gy = s.y;
    /* home zoom: fit the island (~19 x 14 world units on screen) into the area the card leaves free */
    const ppu = innerHeight / (camera.top - camera.bottom);
    const fit = Math.min(1.15, (innerWidth - 2 * s.x) / (17 * ppu), (innerHeight - 2 * s.y - 30) / (12.5 * ppu));
    fly = b
      ? { target: new THREE.Vector3(b.pos.x, 1.3, b.pos.z), zoom: Math.max(1.6, fit * 2.3) }
      : { target: new THREE.Vector3(0, -.6, 0), zoom: fit };
    controls.autoRotate = !b && !reduced;
  }
  window.addEventListener('fly', e => flyTo(e.detail));
  controls.addEventListener('start', () => { fly = null; controls.autoRotate = false; });

  /* ── picking ─────────────────────────────────── */
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), tip = document.getElementById('tip');
  let pointerIn = false, hovered = null, down = null;
  const setNdc = e => ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  const pick = () => { ray.setFromCamera(ndc, camera); const h = ray.intersectObjects(hitboxes)[0]; return h ? h.object.userData.pid : null; };
  canvas.addEventListener('pointermove', e => {
    setNdc(e); pointerIn = e.pointerType === 'mouse';
    tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px';
  });
  canvas.addEventListener('pointerleave', () => { pointerIn = false; });
  canvas.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
  canvas.addEventListener('pointerup', e => {
    if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6){ down = null; return; }
    down = null; setNdc(e);
    const id = pick();
    if (id) UI.show(id);
  });

  /* ── loop ────────────────────────────────────── */
  addEventListener('resize', () => { frustum(); flyTo(window.__view); });
  frustum();
  flyTo(window.__view || 'intro');
  camera.zoom = .7; // small intro zoom-in

  const clock = new THREE.Clock();
  let t = 0, T = reduced ? 99 : 0;   // T = real time since load, drives the intro
  const backOut = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 + 2.7 * (x - 1) ** 3 + 1.7 * (x - 1) ** 2;
  function frame(){
    requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), .05);
    T += dt;
    if (!reduced) t += dt;
    for (const u of updates) u(t);
    applyNight(dt);

    /* intro: island drops in, then buildings pop up one by one */
    const drop = Math.min(1, T / 1.1);
    island.position.y = (1 - (1 - (1 - drop) ** 3)) * 7;
    for (const d of decor) d.g.scale.setScalar(Math.max(1e-3, backOut((T - d.delay) / .5)));

    hovered = pointerIn ? pick() : null;
    canvas.style.cursor = hovered ? 'pointer' : '';
    tip.textContent = hovered || '';
    tip.classList.toggle('show', !!hovered);
    for (const id in buildings){
      const b = buildings[id], goal = id === hovered ? 1.08 : 1;
      b.s += (goal - b.s) * Math.min(1, dt * 12);
      b.g.scale.setScalar(Math.max(1e-3, b.s * backOut((T - b.delay) / .5)));
      if (b.hop){ b.hop = Math.min(1, b.hop + dt * 2.2); if (b.hop === 1) b.hop = 0; }
      b.g.position.y = .1 + Math.sin(b.hop * Math.PI) * .45;
    }

    const k = 1 - Math.exp(-dt * 3.5);
    if (fly){
      const o = camera.position.clone().sub(controls.target);
      controls.target.lerp(fly.target, k);
      camera.position.copy(controls.target).add(o);
      camera.zoom += (fly.zoom - camera.zoom) * k;
      if (controls.target.distanceTo(fly.target) < .005 && Math.abs(fly.zoom - camera.zoom) < .002) fly = null;
    }
    off.x += (off.gx - off.x) * k; off.y += (off.gy - off.y) * k;
    camera.setViewOffset(innerWidth, innerHeight, -off.x, off.y, innerWidth, innerHeight);
    camera.updateProjectionMatrix();
    controls.update();
    renderer.render(scene, camera);
  }
  window.__GL_RUNNING = true;
  frame();
}
</script>

</body>
